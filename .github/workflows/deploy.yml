name: Deploy GlobalOrbitUSA

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-globalorbitusa-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Generate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder for Prisma generate / Next build only. CI never connects to production PostgreSQL.
      DATABASE_URL: postgresql://globalorbitusa_app:ci-placeholder@127.0.0.1:5432/globalorbitusa_db?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Guard package scripts against destructive Prisma commands
        run: |
          set -euo pipefail
          if grep -E 'migrate[[:space:]]+reset|db[[:space:]]+push' package.json prisma/schema.prisma; then
            echo "DESTRUCTIVE_COMMAND_GUARD_FAIL"
            exit 1
          fi
          echo "DESTRUCTIVE_COMMAND_GUARD_OK"

      - name: Build application
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run build; then
              exit 0
            fi
            echo "Build attempt ${attempt} failed; retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Verify Next.js build artifacts
        run: npm run verify:build

  deploy:
    name: Deploy to VPS
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm SSH secrets exist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${VPS_HOST}" ]; then echo "Missing GitHub secret: VPS_HOST"; missing=1; fi
          if [ -z "${VPS_USER}" ]; then echo "Missing GitHub secret: VPS_USER"; missing=1; fi
          if [ -z "${VPS_SSH_KEY}" ]; then echo "Missing GitHub secret: VPS_SSH_KEY"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Add VPS_HOST, VPS_USER, VPS_SSH_KEY, and optional VPS_PORT in this repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          python3 - <<'PY'
          import os, re, sys

          def fail(msg: str) -> None:
              print(msg)
              sys.exit(1)

          host = os.environ.get("VPS_HOST", "").strip()
          user = os.environ.get("VPS_USER", "").strip()
          port = os.environ.get("VPS_PORT", "").strip() or "22"
          key = os.environ.get("VPS_SSH_KEY", "")

          if host != "51.15.21.166":
              fail("SSH_IDENTITY_FAIL: VPS_HOST must be the production VPS IPv4 address")
          if "@" in host:
              fail("SSH_IDENTITY_FAIL: VPS_HOST must be an IP/hostname only, not user@host")
          if user != "sysadmin":
              fail("SSH_IDENTITY_FAIL: VPS_USER must be exactly sysadmin")
          if port != "22":
              fail("SSH_IDENTITY_FAIL: VPS_PORT must be 22")

          raw = key.replace("\r\n", "\n").replace("\r", "\n").strip()
          if raw.count("\n") < 2 and "\\n" in raw:
              raw = raw.replace("\\n", "\n")
          if raw.count("\n") < 2 and "BEGIN" in raw and "END" in raw:
              raw = re.sub(r"[ \t]+", "\n", raw)
          if not raw.endswith("\n"):
              raw += "\n"

          if "BEGIN" not in raw or "PRIVATE KEY" not in raw or "END" not in raw:
              fail("SSH_KEY_FAIL: VPS_SSH_KEY is not a PEM/OpenSSH private key")
          if "Proc-Type: 4,ENCRYPTED" in raw:
              fail("SSH_KEY_FAIL: VPS_SSH_KEY is encrypted")

          print("SSH preflight passed: identity and key shape OK")
          PY

      - name: Deploy GlobalOrbitUSA to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          KEY_FILE="$(mktemp "${RUNNER_TEMP}/globalorbitusa_ssh_key.XXXXXX")"
          KNOWN_HOSTS_FILE="$(mktemp "${RUNNER_TEMP}/globalorbitusa_known_hosts.XXXXXX")"
          cleanup() {
            rm -f "$KEY_FILE" "$KNOWN_HOSTS_FILE"
          }
          trap cleanup EXIT
          export KEY_FILE
          python3 - <<'PY'
          import os, pathlib, re
          key = os.environ["VPS_SSH_KEY"]
          raw = key.replace("\r\n", "\n").replace("\r", "\n").strip()
          if raw.count("\n") < 2 and "\\n" in raw:
              raw = raw.replace("\\n", "\n")
          if raw.count("\n") < 2 and "BEGIN" in raw and "END" in raw:
              raw = re.sub(r"[ \t]+", "\n", raw)
          if not raw.endswith("\n"):
              raw += "\n"
          path = pathlib.Path(os.environ["KEY_FILE"])
          path.write_text(raw)
          path.chmod(0o600)
          PY
          ssh-keyscan -4 -p "$port" -T 10 "${VPS_HOST}" > "$KNOWN_HOSTS_FILE" 2>/dev/null
          SSH=(ssh -4 -i "${KEY_FILE}" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}" -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -p "$port" "${VPS_USER}@${VPS_HOST}")

          echo "==> Running remote deploy script"
          "${SSH[@]}" "bash -s" <<'REMOTE'
          #!/bin/bash
          set -euo pipefail

          test "$(id -un)" = "sysadmin"

          APP_DIR="/srv/apps/globalorbitusa"
          APP_NAME="globalorbitusa"
          APP_PORT="3035"
          EXPECTED_ORIGIN="git@github.com:globalorbitnepal/globalorbitusa.git"

          test "$APP_DIR" = "/srv/apps/globalorbitusa"
          test "$APP_NAME" = "globalorbitusa"
          test "$APP_PORT" = "3035"

          cd "$APP_DIR"
          test "$(git remote get-url origin)" = "$EXPECTED_ORIGIN"

          if ! pm2 describe "$APP_NAME" >/dev/null 2>&1; then
            echo "PM2_PROCESS_MISSING: ${APP_NAME}"
            exit 1
          fi

          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git clean -fd \
            -e .env \
            -e .env.local \
            -e .env.production \
            -e node_modules \
            -e '.port-migration-backup-*'

          test -f .env

          node scripts/verify-database-target.mjs

          export CI=true
          export NODE_OPTIONS="${NODE_OPTIONS:-"--max-old-space-size=4096"}"

          if [ -f package-lock.json ]; then
            npm ci </dev/null
          else
            npm install </dev/null
          fi

          npx prisma generate </dev/null
          npx prisma validate </dev/null

          rm -rf .next-build
          BUILD_OK=0
          for attempt in 1 2 3; do
            if NEXT_DIST_DIR=.next-build npm run build </dev/null; then
              BUILD_OK=1
              break
            fi
            rm -rf .next-build
            sleep 12
          done
          test "$BUILD_OK" = "1"
          NEXT_DIST_DIR=.next-build node scripts/verify-next-artifacts.mjs
          rm -rf .next-stale
          if [ -d .next ]; then mv .next .next-stale; fi
          mv .next-build .next
          rm -rf .next-stale

          pm2 restart "$APP_NAME"

          LISTEN_OK=0
          for _i in $(seq 1 30); do
            if ss -lnt | grep -Eq ":${APP_PORT}([[:space:]]|$)"; then
              LISTEN_OK=1
              break
            fi
            sleep 1
          done
          test "$LISTEN_OK" = "1"

          LOCAL_CODE="$(curl -fsS -o /dev/null -w "%{http_code}" --retry 8 --retry-delay 2 --max-time 20 "http://127.0.0.1:${APP_PORT}/" || true)"
          test "$LOCAL_CODE" = "200"

          echo "==> GlobalOrbitUSA deploy completed"
          REMOTE

          echo "==> GlobalOrbitUSA remote deploy succeeded"
